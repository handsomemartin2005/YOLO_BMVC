# Ultralytics YOLO, AGPL-3.0 license
# YOLOv8n + PPAP-EMA + KDE-HyperGraph + CLAG-RGCU.
# The architecture is kept unchanged from the previous project.

nc: 80

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 3, C2f, [128, True]]                    # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 6, C2f, [256, True]]                    # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 6, C2f, [512, True]]                    # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]                   # 8
  - [-1, 1, PPAPEMA, [8, 0.05, 8, 64, 1]]        # 9
  - [-1, 1, SPPF, [1024, 5]]                     # 10

  # KDE-HyperGraph outputs: R3 / R4 / R5
  - [[2, 4, 6, 8, 10], 1, KDEHyperGraphFusion, [256, 1, 48, 0.1]]   # 11
  - [[2, 4, 6, 8, 10], 1, KDEHyperGraphFusion, [512, 2, 48, 0.1]]   # 12
  - [[2, 4, 6, 8, 10], 1, KDEHyperGraphFusion, [1024, 4, 48, 0.1]]  # 13

head:
  # Top-down path with CLAG + RGCU.
  - [[13, 12], 1, CLAGRGCUFuse, [512]]           # 14
  - [-1, 3, C2f, [512]]                          # 15

  - [[15, 11], 1, CLAGRGCUFuse, [256]]           # 16
  - [-1, 3, C2f, [256]]                          # 17

  # Bottom-up path aggregation keeps the YOLOv8 PAN pattern.
  - [-1, 1, Conv, [256, 3, 2]]                   # 18
  - [[-1, 15], 1, Concat, [1]]                   # 19
  - [-1, 3, C2f, [512]]                          # 20

  - [-1, 1, Conv, [512, 3, 2]]                   # 21
  - [[-1, 13], 1, Concat, [1]]                   # 22
  - [-1, 3, C2f, [1024]]                         # 23

  - [[17, 20, 23], 1, Detect, [nc]]              # 24
